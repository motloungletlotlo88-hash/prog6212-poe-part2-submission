name: Build RaceDay

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        # Crucial for .NET 10 while it is in preview
        dotnet-quality: 'preview'

    - name: Restore dependencies (Main Project Only)
      # Notice we point directly to the RaceDay project file
      run: dotnet restore RaceDay/RaceDay.csproj

    - name: Build (Main Project Only)
      run: dotnet build RaceDay/RaceDay.csproj --no-restore --configuration Release
