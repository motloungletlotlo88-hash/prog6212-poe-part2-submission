name: Validate Repository Structure

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: structure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-structure:
    name: Validate structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository layout
        run: bash scripts/validate-structure.sh
